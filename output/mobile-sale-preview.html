<div id="mobile-sale-preview" class="viz-dotted-background">
  <style>
    #mobile-sale-preview { padding: 20px 8px; }

    #mobile-sale-preview .top { padding: 20px; background: white; border-bottom: 1px solid #eee; color: #3777bc; }

    #mobile-sale-preview h2 { font-size: 19.5px; font-weight: 800; margin: 0 0 24px; color: #071437; }
    #mobile-sale-preview .reference { font-size: 13px; margin-bottom: 13px; overflow-wrap: anywhere; line-height: 1.6; }
    #mobile-sale-preview .reference strong { font-weight: 700; }
    #mobile-sale-preview .panel { border: 1px solid #eee; background: white; }
    #mobile-sale-preview .heading { background: #3777bc; color: white; padding: 18px 20px; font-size: 19.5px; border-radius: 5px 5px 0 0; }

    #mobile-sale-preview label { display: block; font-size: 19.5px; margin-bottom: 8px; color: #333; }
    #mobile-sale-preview label span { color: #d00; }
    #mobile-sale-preview select { width: 100%; min-width: 0; box-sizing: border-box; background: white; color: #555; border: 1px solid #ddd; border-radius: 6px; padding: 12px 8px; font-family: inherit; font-size: 17px; margin-bottom: 22px; }
    #mobile-sale-preview .actions { display: flex; gap: 10px; padding: 10px; border-top: 1px solid #ddd; background: #f9f9f9; }
    #mobile-sale-preview button { flex: 1 1 0; min-width: 0; border: 0; border-radius: 6px; padding: 12px 6px; font-family: inherit; font-size: 15px; color: #111; background: #f1f1f4; }
    #mobile-sale-preview button.save { background: #1e90ff; color: white; }
